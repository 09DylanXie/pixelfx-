<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimoire of 3000</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a grimoire. Schools down the left like tabbed pages, a grid of live spell tiles, a large viewer that opens over it. */
:root {
  --ink: #0d0b14;
  --page: #16131f;
  --page-2: #201b2c;
  --rule: #352d47;
  --text: #ece6f6;
  --muted: #9d93b3;
  --accent: var(--school, #c684ff);
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--text); font-family: var(--body); font-size: 14px; }
#app { display: grid; grid-template-columns: 232px 1fr; height: 100%; }
nav { background: var(--page); border-right: 2px solid var(--rule); overflow-y: auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px; display: flex; flex-direction: column; gap: 14px; }
nav h1 { font: 700 24px/1.05 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
nav h1 span { color: var(--accent); display: block; }
nav .count { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
#schools { display: flex; flex-direction: column; gap: 2px; }
.school { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; background: transparent; border: 0; border-left: 3px solid transparent; color: var(--text); padding: 6px 8px; font: 13px var(--body); cursor: pointer; }
.school:hover { background: var(--page-2); }
.school[aria-current="true"] { background: var(--page-2); border-left-color: var(--sw); font-weight: 600; }
.school:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.swatch { display: flex; height: 8px; width: 56px; }
.swatch i { flex: 1; }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 14px; padding-left: 20px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 2px solid var(--rule); background: var(--page); }
header.bar h2 { font: 700 22px var(--display); margin: 0; color: var(--accent); }
header.bar .desc { color: var(--muted); font-size: 13px; flex-basis: 100%; margin: -4px 0 0; }
.filters { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 12px var(--body); background: var(--page-2); color: var(--text); border: 1px solid var(--rule); padding: 4px 8px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 600; }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.sel { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
select { font: 12px var(--body); background: var(--page-2); color: var(--text); border: 1px solid var(--rule); padding: 3px 6px; }
#grid { overflow-y: auto; padding: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 10px; align-content: start; flex: 1; min-height: 0; }
.tile { background: var(--page); border: 1px solid var(--rule); cursor: pointer; display: flex; flex-direction: column; text-align: left; padding: 0; color: var(--text); font: inherit; }
.tile:hover { border-color: var(--accent); }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tile .stage { aspect-ratio: 4 / 3; display: grid; place-items: center; background: #100e18; overflow: hidden; }
.tile canvas { image-rendering: pixelated; max-width: 100%; max-height: 100%; }
.tile .cap { padding: 6px 8px 8px; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.tile .nm { font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font: 10px var(--mono); color: var(--muted); flex-shrink: 0; }
#viewer { position: fixed; inset: 0; background: rgba(8, 6, 12, .86); display: grid; place-items: center; z-index: 10; padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#viewer .box { background: var(--page); border: 2px solid var(--rule); width: min(980px, 100%); max-height: 100%; overflow: auto; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
#viewer .big { background: #100e18; display: grid; place-items: center; min-height: 340px; padding: 12px; }
#viewer .big canvas { image-rendering: pixelated; max-width: 100%; }
#viewer .info { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
#viewer h3 { font: 700 22px var(--display); margin: 0; color: var(--accent); text-wrap: balance; }
#viewer p { margin: 0; line-height: 1.5; font-size: 13.5px; }
#viewer dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 12.5px; }
#viewer dt { color: var(--muted); }
#viewer dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; word-break: break-all; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { font: 600 12px var(--body); background: var(--page-2); color: var(--text); border: 1px solid var(--rule); padding: 6px 10px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--ink); border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
#sheetOut { display: flex; flex-direction: column; gap: 6px; }
#sheetOut img { image-rendering: pixelated; max-width: 100%; border: 1px solid var(--rule); background: repeating-conic-gradient(#221d30 0 25%, #1a1626 0 50%) 0 0 / 12px 12px; }
#sheetOut small { color: var(--muted); font-size: 12px; line-height: 1.4; }
.credit { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.credit a { color: var(--accent); }
@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav { border-right: 0; border-bottom: 2px solid var(--rule); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-height: 34vh; }
  nav .count, .credit { display: none; }
  #schools { flex-direction: row; flex-wrap: wrap; }
  .school { width: auto; grid-template-columns: auto; border-left: 0; border-bottom: 3px solid transparent; }
  .school[aria-current="true"] { border-bottom-color: var(--sw); }
  .swatch { display: none; }
  #grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  #viewer .box { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .tile:hover { border-color: var(--rule); } }
</style>

<div id="app">
  <nav aria-label="Schools of magic">
    <h1>Grimoire <span>of 3000</span></h1>
    <p class="count" id="count"></p>
    <div id="schools"></div>
    <p class="credit">Generated with the <a href="https://github.com/patch-gg/pixelfx" target="_blank" rel="noopener">pixelfx</a> library and its toolkit. pixelfx is MIT, © 2026 Patch and Hugo Duprez.</p>
  </nav>
  <main>
    <header class="bar">
      <h2 id="schoolName">Blood magic</h2>
      <div class="filters" id="archs" role="group" aria-label="Spell kind"></div>
      <label class="sel" for="form">Form <select id="form">
        <option value="all">All five</option><option value="">Standard</option><option value="lesser">Lesser</option>
        <option value="greater">Greater</option><option value="wild">Wild</option><option value="ancient">Ancient</option></select></label>
      <label class="sel" for="zoom">Zoom <select id="zoom"><option value="1">1×</option><option value="2" selected>2×</option></select></label>
      <p class="desc" id="schoolDesc"></p>
    </header>
    <div id="grid" aria-live="polite"></div>
  </main>
</div>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vName">
  <div class="box">
    <div class="big"><canvas id="vCanvas"></canvas></div>
    <div class="info">
      <h3 id="vName"></h3>
      <p id="vDesc"></p>
      <dl>
        <dt>Id</dt><dd id="vId"></dd>
        <dt>Canvas</dt><dd id="vSize"></dd>
        <dt>Timing</dt><dd id="vTime"></dd>
        <dt>Pivot</dt><dd id="vPivot"></dd>
      </dl>
      <div class="row">
        <button class="btn" id="vReplay" type="button">Replay</button>
        <button class="btn primary" id="vSheet" type="button">Make sprite sheet</button>
        <button class="btn" id="vClose" type="button">Close</button>
      </div>
      <div id="sheetOut" hidden>
        <img id="sheetImg" alt="Sprite sheet of the selected spell, frames in a grid">
        <small id="sheetNote"></small>
      </div>
    </div>
  </div>
</div>

<script src="pfx.js"></script>
<script>
(() => {
const { effects, categories, createFrame, clearFrame, createFx, composite } = PFX;
const $ = (id) => document.getElementById(id);
const BG = 0xff180e10; // #100e18 as a frame colour (ABGR)
const schools = categories.filter((c) => c.id.startsWith("magic-"));
const ids = Object.keys(effects).filter((id) => id.startsWith("magic-"));
const ARCH_ORDER = ["bolt", "orb", "nova", "pillar", "circle", "aura", "burst", "rain", "beam", "vortex", "shield", "portal", "spikes", "charge", "impact", "wave", "summon", "orbit", "sigil", "crescent", "meteor", "cloud", "dash", "flare"];
const ARCH_NAME = { circle: "circle", shield: "ward", portal: "rift", impact: "strike", summon: "summoning", sigil: "mark" };
const parse = (id) => { const [cat, f] = id.split("/"), school = cat.slice(6), rest = f.slice(school.length + 1).split("-"); const form = ["lesser", "greater", "wild", "ancient"].includes(rest[rest.length - 1]) ? rest.pop() : ""; return { school, arch: rest.join("-"), form }; };
$("count").textContent = `${ids.length.toLocaleString()} spell effects in ${schools.length} schools, each a small piece of pixelfx code playing live.`;

let school = schools[0].id.slice(6), arch = "all", form = "all", zoom = 2;
const firstColor = (id) => effects[id].meta.options.palette;

// schools list with each one's palette as a swatch
for (const c of schools) {
  const sid = c.id.slice(6), pal = firstColor(ids.find((i) => i.startsWith(c.id + "/")));
  const b = document.createElement("button");
  b.type = "button"; b.className = "school"; b.dataset.s = sid; b.style.setProperty("--sw", pal[5]);
  b.innerHTML = `<span>${c.name.replace(" magic", "").replace(/^./, (m) => m.toUpperCase())}</span><span class="swatch">${pal.map((h) => `<i style="background:${h}"></i>`).join("")}</span>`;
  b.addEventListener("click", () => { school = sid; render(); });
  $("schools").append(b);
}
const archBar = $("archs");
for (const a of ["all", ...ARCH_ORDER]) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.dataset.a = a; b.textContent = a === "all" ? "All" : (ARCH_NAME[a] ?? a);
  b.addEventListener("click", () => { arch = a; render(); });
  archBar.append(b);
}
$("form").addEventListener("change", (e) => { form = e.target.value; render(); });
$("zoom").addEventListener("change", (e) => { zoom = +e.target.value; render(); });

// ---- live tiles: only tiles on screen play
const live = new Map();
const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    const tile = e.target;
    if (e.isIntersecting) live.set(tile, makePlayer(tile.dataset.id, tile.querySelector("canvas"), zoom));
    else live.delete(tile);
  }
}, { root: $("grid"), rootMargin: "100px" });

function makePlayer(id, cv, z) {
  const mod = effects[id], m = mod.meta, [w, h] = m.size;
  cv.width = w; cv.height = h; cv.style.width = w * z + "px"; cv.style.height = h * z + "px";
  const ctx = cv.getContext("2d"), img = ctx.createImageData(w, h), frame = createFrame(w, h);
  let inst = createFx(mod, { x: m.origin[0], y: m.origin[1] }), wait = 0;
  return {
    step(dt) {
      if (wait > 0) { wait -= dt; if (wait <= 0) inst = createFx(mod, { x: m.origin[0], y: m.origin[1] }); return; }
      inst.update(dt); clearFrame(frame); inst.draw(frame); composite(frame, img.data, BG); ctx.putImageData(img, 0, 0);
      if (inst.done()) wait = 0.5;
    },
    replay() { inst = createFx(mod, { x: m.origin[0], y: m.origin[1] }); wait = 0; },
  };
}

function render() {
  const c = schools.find((x) => x.id === "magic-" + school);
  document.documentElement.style.setProperty("--school", firstColor(ids.find((i) => i.startsWith(c.id + "/")))[5]);
  $("schoolName").textContent = c.name.replace(/^./, (m) => m.toUpperCase());
  document.querySelectorAll(".school").forEach((b) => b.setAttribute("aria-current", b.dataset.s === school ? "true" : "false"));
  document.querySelectorAll("#archs .chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.a === arch ? "true" : "false"));
  const list = ids.filter((id) => { const p = parse(id); return p.school === school && (arch === "all" || p.arch === arch) && (form === "all" || p.form === form); })
    .sort((a, b) => { const p = parse(a), q = parse(b); return ARCH_ORDER.indexOf(p.arch) - ARCH_ORDER.indexOf(q.arch) || ["", "lesser", "greater", "wild", "ancient"].indexOf(p.form) - ["", "lesser", "greater", "wild", "ancient"].indexOf(q.form); });
  $("schoolDesc").textContent = `${list.length} of 120 shown. ${c.blurb.replace(/^./, (m) => m.toUpperCase())}. Click a spell to see it large and make a sprite sheet.`;
  io.disconnect(); live.clear();
  const grid = $("grid"); grid.textContent = "";
  for (const id of list) {
    const m = effects[id].meta, t = document.createElement("button");
    t.type = "button"; t.className = "tile"; t.dataset.id = id; t.title = m.desc;
    t.innerHTML = `<div class="stage"><canvas></canvas></div><div class="cap"><span class="nm">${m.name}</span><span class="tag">${m.loop ? "loop" : "1-shot"}</span></div>`;
    t.addEventListener("click", () => openViewer(id));
    grid.append(t); io.observe(t);
  }
  grid.scrollTop = 0;
}

// ---- the large viewer
let viewer = null;
function openViewer(id) {
  const m = effects[id].meta, cv = $("vCanvas"), z = Math.max(1, Math.min(4, Math.floor(560 / Math.max(m.size[0], m.size[1] * 1.2))));
  viewer = makePlayer(id, cv, z); viewer.id = id;
  $("vName").textContent = m.name; $("vDesc").textContent = m.desc; $("vId").textContent = id;
  $("vSize").textContent = `${m.size[0]} × ${m.size[1]} px (shown ${z}×)`;
  $("vTime").textContent = `${m.duration}s ${m.loop ? "loop" : "one-shot"} at ${m.fps} fps`;
  $("vPivot").textContent = `${m.origin[0]}, ${m.origin[1]}${m.bg === "ground" ? " (on the floor)" : ""}`;
  $("sheetOut").hidden = true; $("viewer").hidden = false; $("vClose").focus();
}
const closeViewer = () => { $("viewer").hidden = true; viewer = null; };
$("vClose").addEventListener("click", closeViewer);
$("viewer").addEventListener("click", (e) => { if (e.target.id === "viewer") closeViewer(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && viewer) closeViewer(); });
$("vReplay").addEventListener("click", () => viewer?.replay());
$("vSheet").addEventListener("click", () => {
  const id = viewer.id, mod = effects[id], m = mod.meta, [w, h] = m.size;
  const n = Math.max(1, Math.round(m.duration * m.fps) + (m.loop ? 0 : 1)), cols = Math.ceil(Math.sqrt(n * h / w)), rows = Math.ceil(n / cols);
  const cv = document.createElement("canvas"); cv.width = w * cols; cv.height = h * rows;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(w, h), frame = createFrame(w, h), inst = createFx(mod, { x: m.origin[0], y: m.origin[1] });
  for (let i = 0; i < n; i++) { clearFrame(frame); inst.draw(frame); composite(frame, img.data, null); ctx.putImageData(img, (i % cols) * w, Math.floor(i / cols) * h); inst.update(1 / m.fps); }
  $("sheetImg").src = cv.toDataURL("image/png");
  $("sheetNote").textContent = `${n} frames of ${w}×${h} in ${cols} columns, transparent, ${m.fps} fps, pivot ${m.origin.join(", ")}. Right-click the image to save it.`;
  $("sheetOut").hidden = false;
});

// ---- one clock for everything on screen
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const p of live.values()) p.step(dt);
  if (viewer) viewer.step(dt);
  requestAnimationFrame(tick);
}
render();
requestAnimationFrame(tick);
})();
</script>
