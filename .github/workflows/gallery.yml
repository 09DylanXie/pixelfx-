name: magic gallery
# Publishes magic-gallery/ (the 3000 generated magic effects) to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# This deliberately does not publish pixelfx's own gallery/, whose font is not MIT (see NOTICE.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check every magic effect
        run: node tools/magic/check.mjs .
      - name: Build the site
        run: |
          mkdir -p dist/site
          npx esbuild magic-gallery/entry.js --bundle --minify --format=iife --global-name=PFX --outfile=dist/site/pfx.js
          cp magic-gallery/magic-gallery.html dist/site/index.html
          cp LICENSE dist/site/LICENSE.txt
          touch dist/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
